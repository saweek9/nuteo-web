{{define "header"}}<a href="#main" class="skip-link">Skip to main content</a>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.PageDescription}}">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/site.css">
  <title>{{.PageTitle}} · {{.SiteName}}</title>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img src="{{.LogoPath}}" alt="{{.SiteName}} logo" width="32" height="32">
        <span>{{.SiteName}}</span>
      </a>

      <button class="mobile-menu-btn" type="button"
              aria-label="Toggle menu" aria-expanded="false"
              aria-controls="primary-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <nav id="primary-nav" class="site-nav" aria-label="Primary">
        <a href="/services"{{if eq .PageURL "/services"}} class="active"{{end}}>{{t "nav.services" .Lang}}</a>
        <a href="/portfolio"{{if eq .PageURL "/portfolio"}} class="active"{{end}}>{{t "nav.portfolio" .Lang}}</a>
        <a href="/blog"{{if hasPrefix .PageURL "/blog"}} class="active"{{end}}>{{t "nav.blog" .Lang}}</a>
        <a href="/about"{{if eq .PageURL "/about"}} class="active"{{end}}>{{t "nav.about" .Lang}}</a>
        <a href="/faq"{{if eq .PageURL "/faq"}} class="active"{{end}}>{{t "nav.faq" .Lang}}</a>

        <form class="search-mini" role="search" action="/search" method="get">
          <label for="search-q" class="sr-only">Search</label>
          <input id="search-q" name="q" type="search" placeholder="{{t "nav.search_placeholder" .Lang}}"
                 autocomplete="off" hx-get="/search" hx-trigger="input changed delay:300ms"
                 hx-target="#search-results" hx-swap="innerHTML" hx-push-url="true">
        </form>

        <div class="lang-switch" aria-label="Language">
          <a href="?lang=en"{{if eq .Lang "en"}} class="active"{{end}} title="English">EN</a>
          <a href="?lang=th"{{if eq .Lang "th"}} class="active"{{end}} title="ภาษาไทย">TH</a>
        </div>

        <a href="/contact" class="btn btn-primary{{if eq .PageURL "/contact"}} active{{end}}">{{t "nav.contact" .Lang}}</a>

        <button class="theme-toggle" type="button"
                aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
               class="theme-icon-sun">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
{{end}}
