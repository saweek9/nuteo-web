{{template "header" .}}
<section class="container section narrow">
  <h1>Admin Login</h1>

  {{if .Error}}
  <div class="alert error" role="alert">{{.Error}}</div>
  {{end}}

  <form method="POST" action="/admin/login" class="contact-form" autocomplete="on">
    <div>
      <label for="user">Username</label>
      <input id="user" name="user" type="text" required autocomplete="username" autofocus>
    </div>
    <div>
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" required autocomplete="current-password">
    </div>
    <div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </div>
  </form>
</section>
{{template "footer" .}}
