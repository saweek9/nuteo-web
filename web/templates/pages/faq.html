{{template "header" .}}
<section class="container section narrow">
  <h1>{{t "faq.title" $.Lang}}</h1>
  <p class="lede">
    {{t "faq.lede" $.Lang}}
    <a href="{{or .FAQContactLink "/contact"}}">{{.ContactLabel}}</a>.
  </p>

  <div class="faq-list">
    {{range .FAQEntries}}
    <details class="faq-item">
      <summary>
        <span class="faq-q">{{.Question}}</span>
        <span class="faq-icon" aria-hidden="true"></span>
      </summary>
      <div class="faq-a">{{safeHTML .Answer}}</div>
    </details>
    {{end}}
  </div>

  <p class="faq-cta">
    <a href="/contact" class="btn btn-primary">{{t "faq.ask_directly" $.Lang}}</a>
  </p>
</section>
{{template "footer" .}}
