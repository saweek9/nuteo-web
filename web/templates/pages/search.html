{{template "header" .}}
<section class="container section narrow">
  <h1>Search</h1>
  <p class="lede">Search across services, portfolio, and blog posts.</p>

  <form method="GET" action="/search" class="search-form" style="margin: var(--space-6) 0;">
    <input type="search" name="q" value="{{.Query}}" placeholder="kubernetes, postmortem, finops..." autofocus>
    <button type="submit" class="btn btn-primary">Search</button>
  </form>

  {{template "search_results" .}}
</section>
{{template "footer" .}}
