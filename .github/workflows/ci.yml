# GitHub Actions workflows for nuteo-web
#
# Conventions:
#   - All workflows run on push/PR to main and on manual dispatch.
#   - Go version matches go.mod (currently 1.25).
#   - Tests are required to pass before merge.
#
# Secrets needed (set in repo Settings → Secrets):
#   - GITHUB_TOKEN (provided automatically by Actions)
#   - For deploy job: SSH_PRIVATE_KEY + VPS_HOST + VPS_USER + VPS_PORT

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Test — required to pass
  # ----------------------------------------------------------------
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o bin/nuteo-web ./cmd/server

      - name: go test (with race detector + coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

  # ----------------------------------------------------------------
  # Lint — separate so it can use different tool versions
  # ----------------------------------------------------------------
  lint:
    name: Lint (gofmt + go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt check
        run: |
          diff -u <(echo -n) <(gofmt -d ./...)
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is dirty after go mod tidy" && exit 1)

  # ----------------------------------------------------------------
  # Docker — build the production image
  # ----------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push — sanity check)
        run: |
          docker build -f deploy/Dockerfile -t nuteo-web:ci-${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run --rm -d --name nuteo-ci -p 18080:8080 \
            -e CONTACT_EMAIL_TO=test@example.com \
            -e CONTACT_EMAIL_FROM=test@example.com \
            -e CSRF_SECRET=test-secret \
            -e ADDR=:8080 \
            nuteo-web:ci-${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:18080/healthz
          docker stop nuteo-ci

  # ----------------------------------------------------------------
  # Deploy — manual dispatch only (production)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://nuteo.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o nuteo-web ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuteo-web
          path: nuteo-web

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nuteo-web,content,web,i18n,deploy,.env"
          target: "/home/admin_nuteo/nuteo-web-staging/"
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command: |
            cd /home/admin_nuteo/nuteo-web-staging
            # Atomic swap: rename then restart
            sudo systemctl stop nuteo-web || true
            cp -r ./* /home/admin_nuteo/nuteo-web/
            sudo systemctl start nuteo-web
            sleep 3
            curl -fsS http://localhost:8080/healthz
